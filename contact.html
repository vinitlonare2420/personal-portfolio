<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Vinit Lonare</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gray-100 text-gray-800">
  <header class="bg-white shadow-sm">
    <nav class="relative mx-auto flex max-w-5xl items-center justify-between px-5 py-4" aria-label="Main navigation">
      <a href="index.html" class="text-xl font-bold text-blue-700">Vinit Lonare</a>
      <button id="menu-button" type="button" class="rounded border border-gray-300 px-3 py-2 text-sm md:hidden" aria-expanded="false" aria-controls="nav-links">Menu</button>
      <div id="nav-links" class="hidden absolute left-0 top-16 z-10 w-full bg-white px-5 py-4 shadow-sm md:static md:block md:w-auto md:p-0 md:shadow-none">
        <div class="flex flex-col gap-4 md:flex-row md:gap-6">
          <a href="index.html" class="hover:text-blue-700">Home</a>
          <a href="about.html" class="hover:text-blue-700">About</a>
          <a href="skills.html" class="hover:text-blue-700">Skills</a>
          <a href="projects.html" class="hover:text-blue-700">Projects</a>
          <a href="contact.html" class="hover:text-blue-700">Contact</a>
        </div>
      </div>
    </nav>
  </header>
  <main class="flex-1 mx-auto max-w-5xl px-5 py-16">
    <section class="rounded bg-white p-6 shadow-sm md:p-10">
      <h1 class="text-3xl font-bold text-gray-900">Contact Me</h1>
      <form id="contact-form" class="mt-6 w-full max-w-xl" action="https://formspree.io/f/myeyljla" method="post" novalidate>
        <label for="name" class="block font-medium">Name</label>
        <input id="name" name="name" type="text" class="mt-2 w-full rounded border border-gray-300 px-3 py-2" aria-describedby="name-error">
        <p id="name-error" class="mt-1 text-sm text-red-600"></p>
        <label for="email" class="mt-4 block font-medium">Email</label>
        <input id="email" name="email" type="email" class="mt-2 w-full rounded border border-gray-300 px-3 py-2" aria-describedby="email-error">
        <p id="email-error" class="mt-1 text-sm text-red-600"></p>
        <label for="subject" class="mt-4 block font-medium">Subject</label>
        <input id="subject" name="subject" type="text" class="mt-2 w-full rounded border border-gray-300 px-3 py-2" aria-describedby="subject-error">
        <p id="subject-error" class="mt-1 text-sm text-red-600"></p>
        <label for="message" class="mt-4 block font-medium">Message</label>
        <textarea id="message" name="message" rows="5" class="mt-2 w-full rounded border border-gray-300 px-3 py-2" aria-describedby="message-error"></textarea>
        <p id="message-error" class="mt-1 text-sm text-red-600"></p>
        <button type="submit" class="mt-5 rounded bg-blue-700 px-5 py-2 text-white hover:bg-blue-800">Submit</button>
        <p id="success-message" class="mt-3 text-green-700" aria-live="polite"></p>
      </form>
      <div class="mt-8 border-t border-gray-300 pt-6">
        <h2 class="text-xl font-bold">Contact Links</h2>
        <div class="mt-3 flex flex-wrap gap-4">
          <a href="mailto:vinitlonare0@gmail.com" class="text-blue-700 hover:underline">vinitlonare0@gmail.com</a>
          <a href="https://www.linkedin.com/in/vinit-lonare-9b7576385/" target="_blank" rel="noopener noreferrer" class="text-blue-700 hover:underline">LinkedIn</a>
          <a href="https://github.com/vinitlonare2420" target="_blank" rel="noopener noreferrer" class="text-blue-700 hover:underline">GitHub</a>
        </div>
      </div>
      <a href="index.html" class="mt-6 inline-block rounded bg-gray-700 px-5 py-2 text-white hover:bg-gray-800">Return to main portfolio</a>
    </section>
  </main>
  <footer class="bg-gray-800 px-5 py-6 text-center text-white">Vinit Lonare</footer>
  <script src="script.js"></script>
</body>
</html>
